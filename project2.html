<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Registration Form</title>
    <link rel="stylesheet" href="project2.css">
    
</head>

<body>
    <div class="form-container">
        <h1>Internship Program</h1>
        <p class="form-subtitle">Application Registration Form</p>

        <form action="/action.php" method="POST">
            <!-- Personal Information Section -->
            <fieldset>
                <legend>Personal Information</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="fname">First Name <span class="required">*</span></label>
                        <input type="text" id="fname" name="fname" required>
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name <span class="required">*</span></label>
                        <input type="text" id="lname" name="lname" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="mobile">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="mobile" name="mobile" pattern="[0-9\-\+\s]{10,}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth <span class="required">*</span></label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender <span class="required">*</span></label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="male" required> Male</label>
                            <label><input type="radio" name="gender" value="female"> Female</label>
                            <label><input type="radio" name="gender" value="other"> Other</label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <!-- Academic Information Section -->
            <fieldset>
                <legend>Academic Information</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="college">College/University <span class="required">*</span></label>
                        <input type="text" id="college" name="college" required>
                    </div>
                    <div class="form-group">
                        <label for="department">Department/Field of Study <span class="required">*</span></label>
                        <input type="text" id="department" name="department" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cgpa">CGPA/Percentage <span class="required">*</span></label>
                        <input type="text" id="cgpa" name="cgpa" placeholder="e.g., 8.5" required>
                    </div>
                    <div class="form-group">
                        <label for="city">Preferred Location</label>
                        <select name="city" id="city">
                            <option value="">Select a city</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Mumbai">Mumbai</option>
                            <option value="Bangalore">Bangalore</option>
                            <option value="Kolkata">Kolkata</option>
                            <option value="Chandigarh">Chandigarh</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Contact Information Section -->
            <fieldset>
                <legend>Contact Information</legend>

                <div class="form-row full">
                    <div class="form-group">
                        <label for="address">Address <span class="required">*</span></label>
                        <input type="text" id="address" name="address" required>
                    </div>
                </div>
            </fieldset>

            <!-- Additional Information Section -->
            <fieldset>
                <legend>Additional Information</legend>

                <div class="form-row full">
                    <div class="form-group">
                        <label>Areas of Interest</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="interest" value="Web Development"> Web Development</label>
                            <label><input type="checkbox" name="interest" value="Mobile Apps"> Mobile Apps</label>
                        </div>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="interest" value="Data Science"> Data Science</label>
                            <label><input type="checkbox" name="interest" value="Cloud Computing"> Cloud Computing</label>
                        </div>
                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label for="cover">Cover Letter / Why do you want this internship?</label>
                        <textarea id="cover" name="cover" placeholder="Tell us about your motivation..."></textarea>
                    </div>
                </div>
            </fieldset>

            <!-- Form Actions -->
            <div class="form-buttons">
                <button type="submit" class="btn-submit">Submit Application</button>
                <button type="reset" class="btn-reset">Clear Form</button>
            </div>
        </form>
    </div>
</body>

</html>
